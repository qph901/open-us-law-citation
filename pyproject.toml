[project]
name = "open-us-law-citation"
version = "0.1.0"
description = "Open US Law Citation: reliable legal references with versioned source evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "qph901", email = "qph@threemen.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "huggingface-hub>=1.28.0",
    "polars>=1.44.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
open-us-law-citation = "open_us_law_citation:main"
# Compatibility alias: the project was renamed from "open-us-law-coverage", and the old
# command still works so existing scripts do not break.
open-us-law-coverage = "open_us_law_citation:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["open_us_law_citation"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
